name: CI & Release Pipeline

on:
  push:
    branches:
      - main
      - chore/foundation-bootstrap
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Compute Target Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.calc_version.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Calculate Next Version
        id: calc_version
        run: node scripts/get-next-version.mjs --github-output

  test-linux:
    name: Build & Test (Ubuntu Linux)
    needs: [version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore VictusBatteryGuardian.slnx

      - name: Build Solution (Debug)
        run: dotnet build VictusBatteryGuardian.slnx --no-restore -c Debug --warnaserror

      - name: Run Unit Tests
        run: dotnet test VictusBatteryGuardian.slnx --no-build -c Debug --verbosity normal

      - name: Package Candidate Windows x64 Binary
        run: |
          pwsh -File ./scripts/package.ps1 -Version ${{ needs.version.outputs.version }} -OutputDir artifacts-ci
          pwsh -File ./scripts/verify-draft.ps1 -ArtifactsDir artifacts-ci

      - name: Upload Windows x64 Validation Package (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: victus-guardian-win-x64-validation-package
          path: artifacts-ci/
          retention-days: 7

  test-windows:
    name: Build & Test (Windows Server)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore VictusBatteryGuardian.slnx

      - name: Build Solution (Release)
        run: dotnet build VictusBatteryGuardian.slnx --no-restore -c Release

      - name: Run Tests (Including Windows Telemetry)
        run: dotnet test VictusBatteryGuardian.slnx --no-build -c Release --verbosity normal

  release:
    name: Semantic Release & Packslip Publishing
    needs: [version, test-linux, test-windows]
    # Releases require protected main branch and explicit administrator authorization via repo variable
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_PRODUCTION_RELEASE == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # Required for keyless Sigstore OIDC cosign signing
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Dependencies
        run: npm ci

      - name: Download Candidate Package from CI
        uses: actions/download-artifact@v4
        with:
          name: victus-guardian-win-x64-validation-package
          path: candidate-artifacts

      - name: Run Semantic Release (Promoting Immutable Candidate)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_PACKAGE: candidate-artifacts/VictusGuardian-v${{ needs.version.outputs.version }}-win-x64.zip
        run: npx semantic-release
