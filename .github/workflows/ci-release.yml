name: CI & Release Pipeline

on:
  push:
    branches:
      - main
      - chore/foundation-bootstrap
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: Build & Test (Ubuntu Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore VictusBatteryGuardian.slnx

      - name: Build Solution (Debug)
        run: dotnet build VictusBatteryGuardian.slnx --no-restore -c Debug --warnaserror

      - name: Run Unit Tests
        run: dotnet test VictusBatteryGuardian.slnx --no-build -c Debug --verbosity normal

      - name: Verify Packaging & Packslip Integrity
        run: |
          pwsh -File ./scripts/package.ps1 -Version 0.2.0-ci -OutputDir artifacts-test
          pwsh -File ./scripts/verify-draft.ps1 -ArtifactsDir artifacts-test
          rm -rf artifacts-test

  test-windows:
    name: Build & Test (Windows Server)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore VictusBatteryGuardian.slnx

      - name: Build Solution (Release)
        run: dotnet build VictusBatteryGuardian.slnx --no-restore -c Release

      - name: Run Tests (Including Windows Telemetry)
        run: dotnet test VictusBatteryGuardian.slnx --no-build -c Release --verbosity normal

  release:
    name: Semantic Release & Packslip Publishing
    needs: [test-linux, test-windows]
    # Releases require protected main branch and explicit administrator authorization via repo variable
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_PRODUCTION_RELEASE == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # Required for keyless Sigstore OIDC cosign signing
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Packaging Script Locally
        run: |
          pwsh -File ./scripts/package.ps1 -Version 0.0.0-ci -OutputDir artifacts-ci
          pwsh -File ./scripts/verify-draft.ps1 -ArtifactsDir artifacts-ci
          rm -rf artifacts-ci

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
