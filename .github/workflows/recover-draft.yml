name: Recover / Verify Draft Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to verify/package (e.g. 1.0.0)'
        required: true
        type: string
      upload_draft:
        description: 'Whether to attach generated assets to GitHub release draft'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  package-and-verify:
    name: Package and Verify Draft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Package Release
        run: |
          pwsh -File ./scripts/package.ps1 -Version "${{ github.event.inputs.version }}" -OutputDir artifacts

      - name: Verify Draft Packslip & Checksums
        run: |
          pwsh -File ./scripts/verify-draft.ps1 -ArtifactsDir artifacts

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: release-draft-${{ github.event.inputs.version }}
          path: artifacts/
